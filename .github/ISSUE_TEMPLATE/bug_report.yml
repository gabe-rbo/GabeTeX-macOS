name: Bug report
description: Report something in GabeTeX that does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing issues first.
        Issues in Portuguese are welcome too. Pode escrever em português.
  - type: input
    id: gabetex-version
    attributes:
      label: GabeTeX version
      description: Shown in GabeTeX › About GabeTeX.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu › About This Mac.
      placeholder: "macOS 26.0"
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model and chip
      description: GabeTeX runs on Apple Silicon Macs. Apple menu › About This Mac shows both.
      placeholder: "MacBook Air (M3)"
    validations:
      required: true
  - type: dropdown
    id: tex-distribution
    attributes:
      label: TeX distribution
      description: The TeX installation GabeTeX is using.
      options:
        - MacTeX
        - BasicTeX
        - TinyTeX
        - Other TeX Live
        - Other
    validations:
      required: true
  - type: dropdown
    id: tex-engine
    attributes:
      label: TeX engine
      description: The engine you compiled with. You can set it in the app or with a `% !TEX program` magic comment.
      options:
        - pdfLaTeX
        - XeLaTeX
        - LuaLaTeX
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong? Include what you saw, such as an error message or a crash.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest steps that show the problem.
      placeholder: |
        1. Open the project ...
        2. Press ⌘B ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: log-excerpt
    attributes:
      label: Relevant LaTeX log excerpt
      description: Paste the lines around the error. Remove anything private first.
      render: text
  - type: textarea
    id: minimal-project
    attributes:
      label: Minimal project
      description: Drag and drop a .zip of the smallest project that shows the problem (usually `main.tex` plus the files it needs). Remove anything private first.
  - type: checkboxes
    id: searched-issues
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this problem has not been reported yet.
          required: true
